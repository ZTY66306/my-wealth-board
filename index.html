<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f8fafc" />
  <title>我的理财收益看板</title>
  
  <!-- Tailwind CSS & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .profit-red { color: #dc2626; }
    .profit-green { color: #16a34a; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-14 selection:bg-rose-100 selection:text-rose-700">
  
  <!-- Toast 提示容器 -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2">
    <div class="bg-slate-900/90 backdrop-blur text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
      <span id="toastMsg">已刷新</span>
    </div>
  </div>

  <!-- 主页面容器 -->
  <div class="max-w-4xl mx-auto px-4 sm:px-6 pt-6 sm:pt-8">
    
    <!-- 顶部状态栏 -->
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">家庭理财看板</h1>
          <button onclick="togglePrivacy()" id="privacyBtn" title="切换金额可见" class="text-slate-400 hover:text-slate-600 transition p-1">
            <svg id="eyeOpenIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            <svg id="eyeClosedIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
          </button>
        </div>
        <p id="syncTime" class="text-xs text-slate-500 mt-1 flex items-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>每天 10:30 自动同步银行净值</span>
        </p>
      </div>

      <!-- 操作按钮（极简直观，亲人点开即用） -->
      <div class="flex items-center gap-2">
        <button onclick="openAddModal()" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 px-4 py-2 bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white text-xs font-semibold rounded-xl shadow-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          添加持仓
        </button>
        <button id="syncBtn" onclick="triggerManualSync()" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-900 hover:bg-slate-800 active:bg-slate-700 text-white text-xs font-semibold rounded-xl shadow-sm transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          立即刷新
        </button>
      </div>
    </header>

    <!-- 资产汇总三卡片 -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-6">
      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-[0_2px_8px_rgba(0,0,0,0.03)]">
        <div class="text-xs font-medium text-slate-500">总持仓市值 (元)</div>
        <div id="totalAssets" class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1 tracking-tight">¥ 80,000.00</div>
        <div class="text-xs text-slate-400 mt-2 flex items-center justify-between">
          <span>投入本金</span>
          <span id="totalPrincipal" class="font-medium text-slate-600">¥ 80,000.00</span>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-[0_2px_8px_rgba(0,0,0,0.03)]">
        <div id="dailyProfitTitle" class="text-xs font-medium text-slate-500">最新一日收益 (元)</div>
        <div id="dailyProfit" class="text-2xl sm:text-3xl font-extrabold mt-1 tracking-tight profit-red">+0.00</div>
        <div class="text-xs text-slate-400 mt-2 flex items-center justify-between">
          <span>披露进度</span>
          <span id="dailyStatus" class="font-medium text-slate-600">--</span>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-[0_2px_8px_rgba(0,0,0,0.03)]">
        <div class="text-xs font-medium text-slate-500">累计总收益 (元)</div>
        <div id="cumProfit" class="text-2xl sm:text-3xl font-extrabold mt-1 tracking-tight profit-red">+0.00</div>
        <div class="text-xs text-slate-400 mt-2 flex items-center justify-between">
          <span>累计收益率</span>
          <span id="totalYield" class="font-semibold profit-red">+0.00%</span>
        </div>
      </div>
    </section>

    <!-- 收益走势折线图 -->
    <section class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-[0_2px_8px_rgba(0,0,0,0.03)] mb-6">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-sm font-bold text-slate-900">收益走势</h2>
          <p class="text-xs text-slate-400">近 30~90 日累计收益表现</p>
        </div>
        <span class="text-xs text-slate-400 bg-slate-50 px-2.5 py-1 rounded-md">单位: 元</span>
      </div>
      <div class="h-56 w-full">
        <canvas id="profitChart"></canvas>
      </div>
    </section>

    <!-- 持仓产品列表 -->
    <section>
      <div class="flex items-center justify-between mb-3 px-1">
        <div class="flex items-center gap-2">
          <h2 class="text-sm font-bold text-slate-900">持仓明细</h2>
          <span id="productCount" class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-medium">2</span>
        </div>
        <div class="flex gap-1 text-xs">
          <button onclick="filterType('all')" id="tabAll" class="px-3 py-1 rounded-lg font-medium bg-slate-900 text-white transition">全部</button>
          <button onclick="filterType('updated')" id="tabUpdated" class="px-3 py-1 rounded-lg font-medium text-slate-600 hover:bg-slate-200 transition">已更新</button>
          <button onclick="filterType('pending')" id="tabPending" class="px-3 py-1 rounded-lg font-medium text-slate-600 hover:bg-slate-200 transition">待披露</button>
        </div>
      </div>

      <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4"></div>
    </section>
  </div>

  <!-- 添加/配置理财弹窗（亲人友好） -->
  <div id="addModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold text-slate-900">添加理财产品</h3>
        <button onclick="closeModal('addModal')" class="text-slate-400 hover:text-slate-600 p-1">✕</button>
      </div>

      <!-- 模糊搜索理财产品（覆盖官网近万只产品） -->
      <div class="mb-4">
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-xs font-semibold text-slate-700">🔍 按名称或代码模糊搜索（支持多关键词空格分隔）：</label>
          <span id="catalogStatus" class="text-[11px] text-slate-400">加载产品库...</span>
        </div>
        <div class="relative">
          <input id="catalogSearch" oninput="onCatalogSearch()" type="text" placeholder="例如：招睿 30天 / 稳富纯债 / 阳光金 / 120030..." class="w-full px-3.5 py-2 border border-rose-200 bg-rose-50/30 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-rose-500/30 focus:border-rose-500" />
        </div>
        <div id="catalogResults" class="hidden mt-1.5 max-h-44 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-100 bg-white shadow-sm text-xs"></div>
      </div>

      <!-- 表单输入 -->
      <div class="space-y-3 border-t border-slate-100 pt-3 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-500 mb-1">所属机构</label>
            <select id="fBank" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white">
              <option value="招银理财">招银理财</option>
              <option value="中银理财">中银理财</option>
              <option value="交银理财">交银理财</option>
              <option value="光大理财">光大理财</option>
              <option value="浦银理财">浦银理财</option>
              <option value="信银理财">信银理财</option>
              <option value="汇华理财">汇华理财</option>
              <option value="中邮理财">中邮理财</option>
              <option value="其他机构">其他机构</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-500 mb-1">理财类型</label>
            <select id="fType" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white">
              <option value="nav">净值型 (按单位净值)</option>
              <option value="ten_thousand">现金管理 (按万份收益)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-slate-500 mb-1">产品名称</label>
          <input id="fName" type="text" placeholder="搜索后自动填充，也可手动输入" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-500 mb-1">产品代码</label>
            <input id="fCode" type="text" placeholder="搜索后自动填充" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg uppercase font-mono" />
          </div>
          <div>
            <label class="block text-slate-500 mb-1">参考最新净值</label>
            <input id="fNav" type="number" step="0.0001" value="1.0000" oninput="autoCalcShares()" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg font-mono bg-slate-50" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-500 mb-1">买入本金 (元)</label>
            <input id="fPrincipal" type="number" step="0.01" placeholder="例如：20000" oninput="autoCalcShares()" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg" />
          </div>
          <div>
            <label class="block text-slate-500 mb-1">持有份额 (自动换算，可微调)</label>
            <input id="fShares" type="number" step="0.01" placeholder="输入本金后自动计算" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg" />
          </div>
        </div>
      </div>

      <div class="mt-5">
        <button id="saveProductBtn" onclick="saveNewHolding()" class="w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold text-xs rounded-xl shadow-sm transition">
          保存持仓并更新看板
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cneckoobjhzcapvlgxmy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_RejX8eEQE8e0edPH9948Ig_6FtLYnkK';
    const SB_HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json'
    };

    let isPrivacyMode = localStorage.getItem('cfg_privacy') === 'true';
    let allProducts = [];
    let currentFilter = 'all';
    let chartInstance = null;

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-2');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2000);
    }

    function togglePrivacy() {
      isPrivacyMode = !isPrivacyMode;
      localStorage.setItem('cfg_privacy', isPrivacyMode);
      updateEyeIcons();
      loadDashboard();
    }

    function updateEyeIcons() {
      if (isPrivacyMode) {
        document.getElementById('eyeOpenIcon').classList.add('hidden');
        document.getElementById('eyeClosedIcon').classList.remove('hidden');
      } else {
        document.getElementById('eyeOpenIcon').classList.remove('hidden');
        document.getElementById('eyeClosedIcon').classList.add('hidden');
      }
    }

    function formatMoney(num) {
      if (isPrivacyMode) return '****';
      return Number(num || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatSign(num) {
      if (isPrivacyMode) return '****';
      if (num > 0) return `+${formatMoney(num)}`;
      return formatMoney(num);
    }

    function getBankBadge(bank) {
      if (bank.includes("招商") || bank.includes("招银")) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-red-50 text-red-700 border border-red-200">招银理财</span>`;
      }
      if (bank.includes("浦发") || bank.includes("浦银")) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-200">浦银理财</span>`;
      }
      if (bank.includes("中邮") || bank.includes("邮储")) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200">中邮理财</span>`;
      }
      if (bank.includes("交银") || bank.includes("交通")) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">交银理财</span>`;
      }
      if (bank.includes("信银") || bank.includes("中信")) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-orange-50 text-orange-700 border border-orange-200">信银理财</span>`;
      }
      if (bank.includes("光大")) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-purple-50 text-purple-700 border border-purple-200">光大理财</span>`;
      }
      if (bank.includes("汇华")) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-cyan-50 text-cyan-800 border border-cyan-200">汇华理财</span>`;
      }
      if (bank.includes("中国") || bank.includes("中银")) {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-rose-50 text-rose-800 border border-rose-200">中银理财</span>`;
      }
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-100 text-slate-700">${bank}</span>`;
    }

    async function loadDashboard() {
      updateEyeIcons();
      try {
        let data = null;
        try {
          const [hRes, histRes] = await Promise.all([
            fetch(`${SUPABASE_URL}/rest/v1/holdings?select=*&order=created_at.asc`, { headers: SB_HEADERS }),
            fetch(`${SUPABASE_URL}/rest/v1/wealth_history?select=*&order=date.asc&limit=90`, { headers: SB_HEADERS })
          ]);
          if (hRes.ok && histRes.ok) {
            const products = await hRes.json();
            const history = await histRes.json();
            let latestUpd = '';
            products.forEach(p => { if (p.updated_at && p.updated_at > latestUpd) latestUpd = p.updated_at; });
            const fmtUpd = latestUpd ? new Date(latestUpd).toLocaleString('zh-CN', { hour12: false }) : '--';
            data = {
              updated_at: `${fmtUpd} (Supabase 云端同步)`,
              summary: {},
              products: products.map(p => ({
                ...p,
                principal: Number(p.principal || 0),
                shares: Number(p.shares || 0),
                current_nav: Number(p.current_nav || 1),
                yesterday_nav: Number(p.yesterday_nav || 1),
                market_value: Number(p.market_value || 0),
                daily_profit: Number(p.daily_profit || 0),
                cumulative_profit: Number(p.cumulative_profit || 0)
              })),
              history: history.map(h => ({
                date: h.date,
                total_assets: Number(h.total_assets || 0),
                daily_profit: Number(h.daily_profit || 0),
                cumulative_profit: Number(h.cumulative_profit || 0)
              }))
            };
          }
        } catch (sbErr) {
          console.warn('Supabase 请求降级到本地缓存:', sbErr);
        }

        if (!data) {
          const res = await fetch(`./data.json?t=${Date.now()}`);
          if (!res.ok) throw new Error('data.json 尚未生成');
          data = await res.json();
        }

        // 确定全部持仓中最新的官方净值日期（如 2026-11-18）
        let latestNavDate = '';
        data.products.forEach(p => {
          if (p.nav_date && p.nav_date > latestNavDate) {
            latestNavDate = p.nav_date;
          }
        });
        window._latestNavDate = latestNavDate;

        // 重新核算总资产和收益（仅将“净值日期 = 最新日”的产品计入最新一日收益，不混算旧日期）
        const USD_CNY = 7.20;
        let sumAssets = 0, sumDaily = 0, sumCum = 0, updatedCnt = 0, pendingCnt = 0;
        data.products.forEach(p => {
          const fx = p.currency === 'USD' ? USD_CNY : 1;
          sumAssets += (p.market_value || p.shares || 0) * fx;
          sumCum += (p.cumulative_profit || 0) * fx;
          const isLatest = !latestNavDate || p.nav_date === latestNavDate;
          if (isLatest) {
            sumDaily += (p.daily_profit || 0) * fx;
            updatedCnt++;
          } else {
            pendingCnt++;
          }
        });
        data.summary.total_assets = sumAssets;
        data.summary.daily_profit = sumDaily;
        data.summary.cumulative_profit = sumCum;
        data.summary.latest_nav_date = latestNavDate;
        data.summary.updated_count = updatedCnt;
        data.summary.pending_count = pendingCnt;

        renderUI(data);
      } catch (err) {
        document.getElementById('syncTime').innerHTML = `<span class="text-slate-500">已展示最新缓存数据</span>`;
      }
    }

    function renderUI(data) {
      const summary = data.summary || {};
      allProducts = data.products || [];
      const latestDate = summary.latest_nav_date || '';
      const shortLatest = latestDate ? latestDate.slice(5) : '';

      if (data.updated_at) {
        document.getElementById('syncTime').innerHTML = `
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
          <span>最近云端核算：${data.updated_at}</span>
        `;
      }

      document.getElementById('totalAssets').textContent = `¥ ${formatMoney(summary.total_assets)}`;
      
      const totalPrincipal = allProducts.reduce((sum, p) => sum + (p.principal || 0) * (p.currency === 'USD' ? 7.20 : 1), 0);
      document.getElementById('totalPrincipal').textContent = `¥ ${formatMoney(totalPrincipal)}`;

      let cnDateLabel = '';
      if (shortLatest && shortLatest.includes('-')) {
        const [mm, dd] = shortLatest.split('-');
        cnDateLabel = `${parseInt(mm, 10)}月${parseInt(dd, 10)}日`;
      }
      document.getElementById('dailyProfitTitle').textContent = cnDateLabel ? `${cnDateLabel}收益 (元)` : '最新一日收益 (元)';
      const dpEl = document.getElementById('dailyProfit');
      dpEl.textContent = formatSign(summary.daily_profit);
      dpEl.className = `text-2xl sm:text-3xl font-extrabold mt-1 tracking-tight ${summary.daily_profit >= 0 ? 'profit-red' : 'profit-green'}`;

      const upd = summary.updated_count || 0;
      const pend = summary.pending_count || 0;
      const totalCnt = allProducts.length;
      const statusEl = document.getElementById('dailyStatus');
      if (pend > 0) {
        statusEl.innerHTML = `<span class="text-emerald-700">${upd}/${totalCnt} 已更新</span> · <span class="text-amber-600">${pend} 待披露</span>`;
      } else {
        statusEl.innerHTML = `<span class="text-emerald-700">全部 ${totalCnt}/${totalCnt} 已更新</span>`;
      }

      const cpEl = document.getElementById('cumProfit');
      cpEl.textContent = formatSign(summary.cumulative_profit);
      cpEl.className = `text-2xl sm:text-3xl font-extrabold mt-1 tracking-tight ${summary.cumulative_profit >= 0 ? 'profit-red' : 'profit-green'}`;

      const yieldRate = totalPrincipal > 0 ? (summary.cumulative_profit / totalPrincipal * 100).toFixed(2) : '0.00';
      document.getElementById('totalYield').textContent = isPrivacyMode ? '****' : `${yieldRate >= 0 ? '+' : ''}${yieldRate}%`;
      document.getElementById('totalYield').className = `font-semibold ${yieldRate >= 0 ? 'profit-red' : 'profit-green'}`;

      renderProducts();
      renderChart(data.history || []);
    }

    function filterType(type) {
      currentFilter = type;
      ['all', 'updated', 'pending'].forEach(t => {
        const btn = document.getElementById(t === 'all' ? 'tabAll' : t === 'updated' ? 'tabUpdated' : 'tabPending');
        if (t === type) {
          btn.className = 'px-3 py-1 rounded-lg font-medium bg-slate-900 text-white transition';
        } else {
          btn.className = 'px-3 py-1 rounded-lg font-medium text-slate-600 hover:bg-slate-200 transition';
        }
      });
      renderProducts();
    }

    function renderProducts() {
      const latestDate = window._latestNavDate || '';
      let filtered = allProducts;
      if (currentFilter === 'updated') {
        filtered = allProducts.filter(p => !latestDate || p.nav_date === latestDate);
      } else if (currentFilter === 'pending') {
        filtered = allProducts.filter(p => latestDate && p.nav_date !== latestDate);
      }
      document.getElementById('productCount').textContent = filtered.length;

      const listEl = document.getElementById('productList');
      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="col-span-2 text-center py-8 text-slate-400 text-xs">暂无该状态理财</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(p => {
        const isNav = p.type === 'nav';
        const sym = p.currency === 'USD' ? '$' : '¥';
        const isLatest = !latestDate || p.nav_date === latestDate;
        const shortDate = p.nav_date ? p.nav_date.slice(5) : '';
        const navDateTag = p.nav_date ? `<span class="text-[11px] text-slate-400 ml-1">(${p.nav_date})</span>` : '';
        const statusBadge = isLatest
          ? `<span class="inline-block ml-1.5 px-1.5 py-0.2 rounded text-[10px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">已更新</span>`
          : `<span class="inline-block ml-1.5 px-1.5 py-0.2 rounded text-[10px] font-medium bg-amber-50 text-amber-700 border border-amber-200">待披露</span>`;
        const metricLabel = isNav ? `最新净值: ${p.current_nav ? Number(p.current_nav).toFixed(4) : '1.0000'}${navDateTag}${statusBadge}` : `万份收益: ${p.ten_k_return || '0.00'}元${navDateTag}${statusBadge}`;
        const itemYield = p.principal > 0 ? (p.cumulative_profit / p.principal * 100).toFixed(2) : '0.00';

        const dailyLabel = isLatest ? `最新收益${shortDate ? ` (${shortDate})` : ''}` : `上期收益 (${shortDate || '旧'})`;
        const dailyValueHtml = isLatest
          ? `<div class="font-bold mt-0.5 ${p.daily_profit >= 0 ? 'profit-red' : 'profit-green'}">${formatSign(p.daily_profit || 0)}</div>`
          : `<div class="font-medium mt-0.5 text-slate-400">${formatSign(p.daily_profit || 0)}<span class="text-[10px] block font-normal text-amber-600/80">未计入本日</span></div>`;

        return `
          <div class="bg-white p-4 sm:p-5 rounded-2xl border ${isLatest ? 'border-slate-200/80' : 'border-amber-200/60 bg-amber-50/10'} shadow-[0_2px_6px_rgba(0,0,0,0.03)] flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2">
                ${getBankBadge(p.bank)}
                <div class="flex items-center gap-1.5">
                  <span class="font-mono text-[11px] text-slate-400">${p.code}</span>
                  <button onclick="deleteHolding('${p.id}')" title="删除该持仓" class="text-slate-300 hover:text-rose-600 transition p-0.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  </button>
                </div>
              </div>
              <h3 class="font-bold text-slate-900 text-sm sm:text-base mt-2 leading-snug">${p.name}</h3>
              <p class="text-xs text-slate-500 mt-1">
                <span class="font-medium">${metricLabel}</span>
              </p>
            </div>

            <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-100 text-xs">
              <div>
                <div class="text-slate-400 text-[11px]">当前市值</div>
                <div class="font-bold text-slate-900 mt-0.5">${sym}${formatMoney(p.market_value || p.shares)}</div>
              </div>
              <div>
                <div class="text-slate-400 text-[11px]">${dailyLabel}</div>
                ${dailyValueHtml}
              </div>
              <div>
                <div class="text-slate-400 text-[11px]">累计总收益</div>
                <div class="font-bold mt-0.5 ${p.cumulative_profit >= 0 ? 'profit-red' : 'profit-green'}">
                  ${formatSign(p.cumulative_profit || 0)}
                  <span class="text-[10px] block font-normal text-slate-400">(${isPrivacyMode ? '**' : itemYield}%)</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderChart(history) {
      const ctx = document.getElementById('profitChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const labels = history.map(h => (h.date ? h.date.slice(5) : ''));
      const values = isPrivacyMode ? history.map(() => 0) : history.map(h => h.cumulative_profit || 0);

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '累计收益 (元)',
            data: values,
            borderColor: '#e11d48',
            backgroundColor: 'rgba(225, 29, 72, 0.08)',
            borderWidth: 2,
            pointRadius: labels.length > 20 ? 0 : 3,
            fill: true,
            tension: 0.35
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 } } },
            y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } }
          }
        }
      });
    }

    let catalogItems = null;
    let selectedNavDate = '';

    async function loadCatalog() {
      const statusEl = document.getElementById('catalogStatus');
      if (catalogItems !== null) {
        statusEl.textContent = `已加载 ${catalogItems.length} 只产品`;
        return;
      }
      statusEl.textContent = '加载官网产品库中...';
      try {
        const res = await fetch(`./catalog.json?t=${Math.floor(Date.now() / 3600000)}`);
        if (!res.ok) throw new Error('尚未生成');
        const json = await res.json();
        catalogItems = json.items || [];
        statusEl.textContent = `已接入 ${catalogItems.length} 只官网产品`;
      } catch (e) {
        catalogItems = [];
        statusEl.textContent = '产品库同步中，可先手动填写';
      }
    }

    function inferBank(name) {
      if (name.includes('招银') || name.includes('招睿') || name.includes('朝朝宝')) return '招银理财';
      if (name.includes('中银') || name.includes('稳富') || name.includes('ESG优享')) return '中银理财';
      if (name.includes('交银') || name.includes('稳享')) return '交银理财';
      if (name.includes('光大') || name.includes('阳光金')) return '光大理财';
      if (name.includes('浦银') || name.includes('双周鑫')) return '浦银理财';
      if (name.includes('信银') || name.includes('安盈象')) return '信银理财';
      if (name.includes('汇华') || name.includes('时间朋友')) return '汇华理财';
      if (name.includes('中邮') || name.includes('惠农')) return '中邮理财';
      return '其他机构';
    }

    function onCatalogSearch() {
      const q = document.getElementById('catalogSearch').value.trim().toLowerCase();
      const box = document.getElementById('catalogResults');
      if (!q || !catalogItems || catalogItems.length === 0) {
        box.classList.add('hidden');
        return;
      }
      const tokens = q.split(/\s+/).filter(Boolean);
      const hits = [];
      for (let i = 0; i < catalogItems.length; i++) {
        const [code, name, nav, dt] = catalogItems[i];
        const hay = (code + ' ' + name).toLowerCase();
        if (tokens.every(t => hay.includes(t))) {
          hits.push(catalogItems[i]);
          if (hits.length >= 20) break;
        }
      }
      box.classList.remove('hidden');
      if (hits.length === 0) {
        box.innerHTML = `<div class="p-3 text-center text-slate-400">未匹配到产品，可尝试缩短关键词或在下方手动填写</div>`;
        return;
      }
      box.innerHTML = hits.map((item, idx) => {
        const [code, name, nav, dt] = item;
        return `
          <div onclick='pickCatalogItem(${JSON.stringify(code)}, ${JSON.stringify(name)}, ${nav}, ${JSON.stringify(dt)})' class="p-2.5 hover:bg-rose-50 cursor-pointer transition flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="font-semibold text-slate-800 truncate">${name}</div>
              <div class="text-[11px] text-slate-400 font-mono mt-0.5">${code} · ${dt || ''}</div>
            </div>
            <div class="text-right shrink-0">
              <div class="text-xs font-bold text-rose-600">${Number(nav).toFixed(4)}</div>
              <div class="text-[10px] text-slate-400">单位净值</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function pickCatalogItem(code, name, nav, dt) {
      document.getElementById('fBank').value = inferBank(name);
      document.getElementById('fName').value = name;
      document.getElementById('fCode').value = code;
      document.getElementById('fNav').value = Number(nav).toFixed(4);
      document.getElementById('fType').value = 'nav';
      selectedNavDate = dt || '';
      document.getElementById('catalogResults').classList.add('hidden');
      document.getElementById('catalogSearch').value = '';
      autoCalcShares();
      showToast(`已选中：${name} (净值 ${Number(nav).toFixed(4)})`);
    }

    function autoCalcShares() {
      const principal = parseFloat(document.getElementById('fPrincipal').value);
      const nav = parseFloat(document.getElementById('fNav').value) || 1.0;
      if (!isNaN(principal) && principal > 0 && nav > 0) {
        document.getElementById('fShares').value = (principal / nav).toFixed(2);
      }
    }

    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('catalogSearch').value = '';
      document.getElementById('catalogResults').classList.add('hidden');
      loadCatalog();
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    async function triggerManualSync() {
      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      btn.innerHTML = `<span class="inline-block animate-spin mr-1">↻</span> 刷新中...`;

      await loadDashboard();

      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = `立即刷新`;
        showToast('✅ 已为您刷新至最新数据');
      }, 500);
    }

    async function saveNewHolding() {
      const bank = document.getElementById('fBank').value;
      const type = document.getElementById('fType').value;
      const name = document.getElementById('fName').value.trim();
      const code = document.getElementById('fCode').value.trim().toUpperCase();
      const nav = parseFloat(document.getElementById('fNav').value) || 1.0;
      const shares = parseFloat(document.getElementById('fShares').value);
      const principal = parseFloat(document.getElementById('fPrincipal').value);

      if (!name || !code || isNaN(shares) || isNaN(principal)) {
        return alert('请先搜索或填写产品名称、代码和买入本金！');
      }

      const btn = document.getElementById('saveProductBtn');
      btn.disabled = true;
      btn.textContent = '正在保存到云端数据库...';

      const mv = Number((shares * nav).toFixed(2));
      const newRow = {
        id: `prod_${Date.now()}`,
        bank,
        name,
        code,
        type,
        currency: name.includes('美元') ? 'USD' : 'CNY',
        principal,
        shares,
        current_nav: nav,
        yesterday_nav: nav,
        market_value: mv,
        daily_profit: 0.0,
        cumulative_profit: Number((mv - principal).toFixed(2)),
        nav_date: selectedNavDate || '',
        sync_status: selectedNavDate ? 'live' : 'cached'
      };

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/holdings`, {
          method: 'POST',
          headers: { ...SB_HEADERS, 'Prefer': 'return=minimal' },
          body: JSON.stringify(newRow)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        closeModal('addModal');
        showToast('🎉 已保存到云端数据库！全家手机同步生效');
        await loadDashboard();
      } catch (err) {
        alert('保存失败，请检查网络后重试：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '保存持仓并更新看板';
      }
    }

    async function deleteHolding(id) {
      if (!confirm("确定要删除该持仓产品吗？（将同步从全家云端账本移除）")) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/holdings?id=eq.${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: SB_HEADERS
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        showToast("🗑️ 已从云端删除该持仓并重算总资产");
        await loadDashboard();
      } catch (err) {
        alert('删除失败，请稍后重试：' + err.message);
      }
    }

    window.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
