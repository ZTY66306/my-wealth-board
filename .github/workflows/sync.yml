name: Daily Wealth Sync

on:
  schedule:
    # 每天北京时间 10:30 (UTC 02:30) 自动抓取
    - cron: '30 2 * * *'
    # 每天北京时间 16:00 (UTC 08:00) 针对部分延迟披露理财进行二次抓取
    - cron: '0 8 * * *'
  push:
    paths:
      - 'holdings.json'
      - 'sync_wealth.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 || true

      - name: Run Wealth Sync
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python sync_wealth.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json sync_debug.log || true
          git diff --staged --quiet || (git commit -m "chore: auto-sync live wealth NAV [skip ci]" && git push)
